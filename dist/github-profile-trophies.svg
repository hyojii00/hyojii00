<svg xmlns="http://www.w3.org/2000/svg" width="980" height="170" viewBox="0 0 980 170" role="img" aria-labelledby="title desc">
<title id="title">GitHub profile trophies for hyojii00</title>
<desc id="desc">Static local SVG trophy cards generated from public GitHub profile stats to avoid broken third-party trophy images.</desc>
<defs>
